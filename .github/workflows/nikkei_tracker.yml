name: Nikkei 225 Daily Tracker

# 設定觸發條件
on:
  schedule:
    # 這裡使用 UTC 時間。UTC 07:30 = 台灣時間 15:30 (每週一到週五)
    - cron: '30 7 * * 1-5'
  # 加入 workflow_dispatch 讓你可以隨時在 GitHub 網頁上手動點選執行測試
  workflow_dispatch: 

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' 

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # 安裝程式碼中需要用到的所有套件 (包含解析 Wiki 表格需要的 lxml)
        pip install yfinance pandas matplotlib requests deep-translator lxml

    - name: Run Nikkei Tracker
      env:
        # 從 GitHub Secrets 中讀取 webhook 網址，避免外洩
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        # 請確保這裡的檔名與你上傳到 GitHub 的 Python 檔名完全一致
        python nikkei225_losers.py
